<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algo Trading Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0a0a0f; color: #e2e8f0; min-height: 100vh; }
  header { background: #111827; border-bottom: 1px solid #1f2937; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 700; color: #60a5fa; }
  .badge { background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 14px; color: #9ca3af; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
  select, button { background: #1f2937; color: #e2e8f0; border: 1px solid #374151; border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; color: white; padding: 10px 20px; font-weight: 600; width: 100%; margin-top: 12px; }
  button.primary:hover { background: #1d4ed8; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .symbol-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .symbol-btn { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; font-family: monospace; }
  .symbol-btn.active { background: #1d4ed8; border-color: #3b82f6; }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .toggle { width: 40px; height: 22px; background: #374151; border-radius: 999px; border: none; cursor: pointer; position: relative; transition: background 0.2s; }
  .toggle.on { background: #ef4444; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(18px); }
  .signal { display: flex; justify-content: space-between; align-items: center; background: #1f2937; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .signal .symbol { font-weight: 700; font-family: monospace; font-size: 15px; }
  .signal .side { padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; }
  .signal .side.buy { background: #064e3b; color: #34d399; }
  .signal .side.sell { background: #7f1d1d; color: #f87171; }
  .signal .conf { color: #60a5fa; font-size: 13px; }
  .empty { color: #6b7280; text-align: center; padding: 32px; font-size: 14px; }
  .stat { text-align: center; }
  .stat .value { font-size: 28px; font-weight: 700; color: #60a5fa; }
  .stat .label { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  #log { background: #0d1117; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #6b7280; max-height: 120px; overflow-y: auto; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>⚡ Algo Trading Engine</h1>
  <span class="badge"><span class="status-dot"></span>PAPER TRADING</span>
</header>
<div class="container">
  <div class="grid">
    <div class="card">
      <h2>Strategy Config</h2>
      <label style="font-size:13px;color:#9ca3af;">Strategy</label>
      <select id="strategy" style="width:100%;margin:8px 0 16px;">
        <option value="macd">MACD Crossover</option>
        <option value="momentum">Momentum</option>
      </select>
      <label style="font-size:13px;color:#9ca3af;">Symbols</label>
      <div class="symbol-grid" id="symbols">
        <button class="symbol-btn active" onclick="toggleSymbol(this,'SPY')">SPY</button>
        <button class="symbol-btn active" onclick="toggleSymbol(this,'QQQ')">QQQ</button>
        <button class="symbol-btn" onclick="toggleSymbol(this,'AAPL')">AAPL</button>
        <button class="symbol-btn" onclick="toggleSymbol(this,'MSFT')">MSFT</button>
        <button class="symbol-btn" onclick="toggleSymbol(this,'TSLA')">TSLA</button>
      </div>
      <div class="toggle-row">
        <button class="toggle" id="liveToggle" onclick="toggleLive(this)"></button>
        <span id="liveLabel" style="font-size:13px;color:#fbbf24;">🧪 Paper mode (safe)</span>
      </div>
      <button class="primary" id="runBtn" onclick="runStrategy()">Run Strategy</button>
    </div>

    <div class="card">
      <h2>Signals</h2>
      <div id="signals"><p class="empty">Run a strategy to see signals</p></div>
    </div>

    <div class="card">
      <h2>Portfolio Stats</h2>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin:0;">
        <div class="stat"><div class="value" id="portfolioVal">—</div><div class="label">Portfolio Value</div></div>
        <div class="stat"><div class="value" id="signalCount">0</div><div class="label">Signals Today</div></div>
      </div>
      <div id="log">Waiting for first strategy run...</div>
    </div>
  </div>
</div>

<script>
const ENGINE = 'https://web-production-0fda1.up.railway.app';
let selectedSymbols = ['SPY','QQQ'];
let isLive = false;

function toggleSymbol(btn, sym) {
  btn.classList.toggle('active');
  if (selectedSymbols.includes(sym)) selectedSymbols = selectedSymbols.filter(s => s !== sym);
  else selectedSymbols.push(sym);
}

function toggleLive(btn) {
  isLive = !isLive;
  btn.classList.toggle('on', isLive);
  document.getElementById('liveLabel').textContent = isLive ? '🔴 LIVE — real orders!' : '🧪 Paper mode (safe)';
  document.getElementById('liveLabel').style.color = isLive ? '#f87171' : '#fbbf24';
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.scrollTop = el.scrollHeight;
}

async function runStrategy() {
  const btn = document.getElementById('runBtn');
  const strategy = document.getElementById('strategy').value;
  if (!selectedSymbols.length) { alert('Select at least one symbol'); return; }
  btn.disabled = true; btn.textContent = 'Running...';
  log('Running ' + strategy.toUpperCase() + ' on ' + selectedSymbols.join(','));
  try {
    const res = await fetch(ENGINE + '/run-strategy', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({strategy_name: strategy, symbols: selectedSymbols, params: {}, dry_run: !isLive})
    });
    const data = await res.json();
    document.getElementById('portfolioVal').textContent = '$' + (data.portfolio_value || 0).toLocaleString();
    document.getElementById('signalCount').textContent = data.signals?.length || 0;
    const sigEl = document.getElementById('signals');
    if (!data.signals?.length) { sigEl.innerHTML = '<p class="empty">No signals generated</p>'; }
    else {
      sigEl.innerHTML = data.signals.map(s => `
        <div class="signal">
          <span class="symbol">${s.symbol}</span>
          <span class="side ${s.side}">${s.side.toUpperCase()}</span>
          <span style="color:#e2e8f0;font-size:13px;">${s.qty} @ $${s.price?.toFixed(2)}</span>
          <span class="conf">${(s.confidence*100).toFixed(0)}%</span>
        </div>`).join('');
    }
    log('Done. ' + (data.signals?.length||0) + ' signals. ' + (data.dry_run?'(paper)':'(LIVE)'));
  } catch(e) { log('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Run Strategy';
}

// Load health on start
fetch(ENGINE + '/health').then(r=>r.json()).then(d=>log('Engine connected. Status: ' + d.status)).catch(()=>log('Engine unreachable'));
</script>
</body>
</html>
