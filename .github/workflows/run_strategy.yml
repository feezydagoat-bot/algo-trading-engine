name: Run Strategy at Market Open

on:
  # schedule disabled — cron-job.org handles triggering at 9:30am ET (America/New_York)
  # schedule:
  #   - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy (momentum or macd)'
        required: false
        default: 'momentum'
      dry_run:
        description: 'Paper mode true/false'
        required: false
        default: 'false'

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Run strategy on AAPL and AAL
        run: |
          STRATEGY=${{ github.event.inputs.strategy || 'momentum' }}
          DRY_RUN=${{ github.event.inputs.dry_run || 'false' }}
          echo "Running $STRATEGY (dry_run=$DRY_RUN)"
          curl -f -X POST "${{ secrets.RAILWAY_URL }}/run-strategy" \
            -H "Content-Type: application/json" \
            -d "{\"strategy_name\":\"$STRATEGY\",\"symbols\":[\"AAPL\",\"AAL\"],\"params\":{},\"dry_run\":$DRY_RUN}" \
            | python3 -m json.tool
